    contents: ''
    style: floating
    background: light
    foreground: dark
    border: true
    alignment: left
    collapse-level: 1
    pinned: true
    header: ''
    footer: ''
  margin-header: ''
  page-footer: CC-BY (2026) Philip Leftwich
  chapters:
    - index.qmd
    - part: "Week One"
      chapters:
        - session-01-pre.qmd
        - session-01-workshop.qmd
        - session-01-computation.qmd
    - part: "Week Two"
      chapters:
        - session-02-pre.qmd
        - session-02-workshop.qmd
        - session-02-computation.qmd
    - part: "Week Three"
      chapters:
        - session-03-pre.qmd
        - session-03-workshop.qmd
        - session-03-computation.qmd
    - part: "Week Four"
      chapters:
        - session-04-pre.qmd
        - session-04-workshop.qmd
        - session-04-computation.qmd

bibliography:
  - include/packages.bib
  - include/references.bib
csl: include/apa.csl
format:
  html:
    theme:
      light:
      - flatly
      - include/light.scss
      dark:
      - darkly
      - include/dark.scss
    css:
    - https://use.fontawesome.com/releases/v5.13.0/css/all.css
    - include/booktem.css
    - include/webex.css
    - include/glossary.css
    - include/style.css
    df-print: kable
    code-link: true
    code-fold: false
    code-line-numbers: true
    code-overflow: scroll
    code-copy: hover
    highlight-style: a11y
    mainfont: ''
    monofont: ''
    include-after-body:
    - include/webex.js
    - include/script.js
