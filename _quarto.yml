  subtitle: ''
  author: Philip Leftwich
  doi: ''
  license: CC-BY
  description: Statistical skills for Biologists
  cover-image: images/logos/logo.png
  image: images/logos/logo.png
  favicon: images/logos/logo.png
  cookie-consent: false
  google-analytics: ''
  page-navigation: true
  search: true
  sidebar:
    title: ''
    logo: ''
